  <style>

      --accent: #e74c3c;
      --bg: linear-gradient(135deg, #1a1a2e, #16213e);

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
    }
    #map { width: 100%; height: 100vh; filter: brightness(1.05); }

    #map .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.7);
    }

    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(26,26,46,0.95), rgba(26,26,46,0));
      color: white;
      pointer-events: none;
    }
    .header h1 { margin: 0; font-size: 1.2rem; font-weight: 600; }
    .header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.7; transition: color 0.3s; }

    .header::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      background: linear-gradient(90deg,
        var(--accent), #f1c40f, #27ae60, #3498db,
        var(--accent), #f1c40f, #27ae60, #3498db);
      background-size: 200% 100%;
      animation: garland 8s linear infinite;
      box-shadow: 0 0 12px rgba(241,196,15,0.6);
    }

    @keyframes garland {
      0% { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    #mode-switch {
      position: fixed;
      top: 80px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: none;
      background: rgba(0,0,0,0.6);
      border-radius: 12px;
      padding: 4px;
      backdrop-filter: blur(8px);
      gap: 4px;
    }
    #mode-switch button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      color: white;
      background: transparent;
      font-weight: 600;
      transition: background 0.2s;
    }
    #mode-switch button.active {
      background: var(--accent);
    }

    #login-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: white; padding: 24px;
      transition: opacity 0.4s, background 0.4s;
    }
    #login-screen h1 { margin: 0 0 8px; font-size: 2rem; }
    #login-screen p.sub { opacity: 0.7; margin: 0 0 32px; }

    .login-input {
      width: 100%; max-width: 320px;
      padding: 14px 16px; margin-bottom: 12px;
      border-radius: 12px; border: none; font-size: 16px;
      background: rgba(255,255,255,0.1); color: white;
      outline: none;
      box-sizing: border-box;
    }
    .login-input::placeholder { color: rgba(255,255,255,0.5); }

    .avatar-upload {
      width: 100%; max-width: 320px; margin-bottom: 12px;
      display: flex; align-items: center; gap: 12px;
    }
    .avatar-label {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 2px dashed rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; overflow: hidden;
      flex-shrink: 0;
    }
    .avatar-label:hover { border-color: var(--accent); }

    .remember-label {

      color: rgba(255,255,255,0.8); font-size: 14px; cursor: pointer;
    }
    .remember-label input {

    }

    #btn-join {

      font-size: 16px; font-weight: 600;
      background: var(--accent); color: white; cursor: pointer;
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    #btn-join:hover { opacity: 0.9; }

    #login-error {

    }

// === Подписка на Push ===
async function subscribeToPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    console.log('Push не поддерживается');
    return;
  }

  try {
    const registration = await navigator.serviceWorker.ready;
    
    // Проверяем, есть ли уже подписка
    let subscription = await registration.pushManager.getSubscription();
    
    if (!subscription) {
      // Получаем публичный ключ с сервера
      const res = await fetch('/vapid-public-key');
      const data = await res.json();
      
      // Конвертируем ключ в формат для браузера
      const convertedKey = urlBase64ToUint8Array(data.key);
      
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: convertedKey
      });
    }
    
    // Отправляем подписку на сервер
    socket.emit('subscribe-push', subscription.toJSON());
    console.log('✅ Push-подписка активна');
    
  } catch (err) {
    console.error('Ошибка подписки на Push:', err);
  }
}

// Конвертация ключа
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding)
    .replace(/\-/g, '+')
    .replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

        ? `<img src="${avatar}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`
        : mascot;

      return L.divIcon({
        className: 'my-marker',
        html: `
          <div style="
            width: 48px; height: 48px;
            background: ${color};
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 14px ${color};
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            overflow: hidden;
          ">${content}</div>
        `,
        iconSize: [48, 48],
        iconAnchor: [24, 24]
      });
    }

    function makeUserIcon(name, color, mascot, vip = false, avatar = null, status = 'active') {
      const size = vip ? 60 : 44;
      const fontSize = vip ? 28 : 20;
      const border = vip ? '4px solid #f1c40f' : '3px solid #fff';
      const glow = vip
        ? `0 0 20px #f1c40f, 0 0 40px rgba(241,196,15,0.5)`
        : `0 0 12px ${color}`;

      const pulseClass = vip ? 'vip-pulse' : '';
      const content = avatar
        ? `<img src="${avatar}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`
        : mascot;

      const statusEmoji = {
        home: '🏠',
        moving: '🚗',
        visiting: '🎉',
        sleeping: '💤',
        active: ''
      }[status] || '';

      return L.divIcon({
        className: 'user-marker',
        html: `
          <div style="display: flex; flex-direction: column; align-items: center;">
            <div class="${pulseClass}" style="
              width: ${size}px; height: ${size}px;
              background: ${color};
              border: ${border};
              border-radius: 50%;
              box-shadow: ${glow};
              display: flex; align-items: center; justify-content: center;
              font-size: ${fontSize}px;
              overflow: hidden;
              position: relative;
            ">${content}
              ${statusEmoji ? `<div style="
                position: absolute; bottom: -4px; right: -4px;
                width: 20px; height: 20px;
                background: white; border-radius: 50%;
                display: flex; align-items: center; justify-content: center;
                font-size: 12px;
                border: 1px solid rgba(0,0,0,0.1);
              ">${statusEmoji}</div>` : ''}
            </div>
            <div style="
              margin-top: 4px;
              background: ${vip ? 'rgba(241,196,15,0.9)' : 'rgba(0,0,0,0.7)'};
              color: ${vip ? '#1a1a2e' : 'white'};
              padding: 2px 8px;
              border-radius: 10px;
              font-size: 12px;
              font-weight: ${vip ? '700' : '400'};
              white-space: nowrap;
              display: flex; align-items: center; gap: 4px;
            ">${vip ? '⭐' : ''} ${mascot} ${name}</div>
          </div>
        `,
        iconSize: [size, size + 28],
        iconAnchor: [size / 2, size / 2]
      });
    }

    function moveMarkerSmoothly(marker, newLat, newLng, duration = 1000) {
      const start = marker.getLatLng();
      const startLat = start.lat, startLng = start.lng;
      const startTime = performance.now();

      function step(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        const lat = startLat + (newLat - startLat) * eased;
        const lng = startLng + (newLng - startLng) * eased;
        marker.setLatLng([lat, lng]);
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    const FAMILY_COLORS = {
      ovchinnikov: '#e74c3c',
      baranov: '#3498db',
      sarapin: '#27ae60',
      starshee: '#f1c40f'
    };
    const FAMILY_MASCOTS = {
      ovchinnikov: '🐑',
      baranov: '🐏',
      sarapin: '🎉',
      starshee: '🦉'
    };

    function shouldShow(user) {
      if (!myFamily) return false;
      if (user.id === socket.id) return true;
      if (showAllFamilies) return true;
      const sameFamily = user.family === myFamily.familyId;
      return sameFamily || user.vip;
    }

    function addOrUpdateMarker(id, lat, lng, name, family, vip = false, avatar = null, status = 'active') {
      const color = FAMILY_COLORS[family] || '#888';
      const mascot = FAMILY_MASCOTS[family] || '👤';

      if (otherMarkers[id]) {
        const cur = otherMarkers[id].getLatLng();
        if (Math.abs(cur.lat - lat) < 0.00001 && Math.abs(cur.lng - lng) < 0.00001) {
          otherMarkers[id].setIcon(makeUserIcon(name, color, mascot, vip, avatar, status));
          if (snowballMode) {
            otherMarkers[id].off('click');
            otherMarkers[id].on('click', () => {
              socket.emit('throw-snowball', { targetId: id });
              exitSnowballMode();
            });
          }
          return;
        }
        moveMarkerSmoothly(otherMarkers[id], lat, lng, 1000);
        otherMarkers[id].setIcon(makeUserIcon(name, color, mascot, vip, avatar, status));
      } else {
        otherMarkers[id] = L.marker([lat, lng], {
          icon: makeUserIcon(name, color, mascot, vip, avatar, status)
        }).addTo(map);

        trails[id] = L.polyline([], {
          color: color, weight: 3, opacity: 0.5, smoothFactor: 2
        }).addTo(map);
      }

      if (snowballMode) {
        otherMarkers[id].off('click');
        otherMarkers[id].on('click', () => {
          socket.emit('throw-snowball', { targetId: id });
          exitSnowballMode();
        });
      }

      if (trails[id]) {
        const points = trails[id].getLatLngs();
        const last = points[points.length - 1];
        if (!last || map.distance(last, [lat, lng]) > 20) {
          trails[id].addLatLng([lat, lng]);
          if (trails[id].getLatLngs().length > 100) {
            trails[id].setLatLngs(trails[id].getLatLngs().slice(-100));
          }
        }
      }
    }

    function showFireworks() {
      const canvas = document.createElement('canvas');
      canvas.style.cssText = `
        position: fixed; inset: 0; z-index: 10001;
        pointer-events: none;
      `;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      const particles = [];
      const colors = ['#e74c3c', '#f1c40f', '#27ae60', '#3498db', '#9b59b6', '#fff'];

      const bursts = 5;
      for (let i = 0; i < bursts; i++) {
        setTimeout(() => {
          const x = Math.random() * canvas.width * 0.6 + canvas.width * 0.2;
          const y = Math.random() * canvas.height * 0.4 + canvas.height * 0.2;

          for (let j = 0; j < 60; j++) {
            const angle = (Math.PI * 2 * j) / 60;
            const speed = Math.random() * 5 + 2;
            particles.push({
              x, y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              color: colors[Math.floor(Math.random() * colors.length)],
              life: 1,
              decay: 0.012 + Math.random() * 0.01
            });
          }
        }, i * 400);
      }

      let animationId;
      function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.08;
          p.vx *= 0.99;
          p.life -= p.decay;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        if (particles.length > 0) {
          animationId = requestAnimationFrame(animate);
        } else {
          cancelAnimationFrame(animationId);
          canvas.remove();
        }
      }
      animate();

      setTimeout(() => {
        if (canvas.parentNode) canvas.remove();
      }, 5000);
    }

    function startTracking() {
      if (!navigator.geolocation) {
        document.querySelector('.header p').textContent = 'Геолокация не поддерживается';

      }

      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          
          currentLat = lat;
          currentLng = lng;

          if (!window.myMarker) {
            window.myMarker = L.marker([lat, lng], { icon: myIcon }).addTo(map);
            map.setView([lat, lng], 15);
          } else {
            moveMarkerSmoothly(window.myMarker, lat, lng, 800);
          }

          const myPoints = myTrail.getLatLngs();
          const myLast = myPoints[myPoints.length - 1];
          if (!myLast || map.distance(myLast, [lat, lng]) > 20) {
            myTrail.addLatLng([lat, lng]);
            if (myTrail.getLatLngs().length > 100) {
              myTrail.setLatLngs(myTrail.getLatLngs().slice(-100));
            }

          socket.emit('location', { lat, lng, home: homePoint });

          document.querySelector('.header p').textContent =
            `Ваши координаты: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;

        (error) => {

          let msg = 'Ошибка геолокации';
          if (error.code === 1) msg = 'Вы запретили доступ к геолокации';
          if (error.code === 2) msg = 'Местоположение недоступно';
          if (error.code === 3) msg = 'Превышено время ожидания';

        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }

    // === Запись голосового ===
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let audioMimeType = '';

    if (window.MediaRecorder) {
      if (MediaRecorder.isTypeSupported('audio/webm')) audioMimeType = 'audio/webm';
      else if (MediaRecorder.isTypeSupported('audio/mp4')) audioMimeType = 'audio/mp4';
      else if (MediaRecorder.isTypeSupported('audio/aac')) audioMimeType = 'audio/aac';
    }

    document.getElementById('record-audio').addEventListener('click', async () => {
      const btn = document.getElementById('record-audio');
      
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          mediaRecorder = new MediaRecorder(stream, audioMimeType ? { mimeType: audioMimeType } : undefined);
          audioChunks = [];
          
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };
          
          mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: audioMimeType || 'audio/webm' });
            stream.getTracks().forEach(t => t.stop());
            
            const ext = audioMimeType.includes('mp4') ? 'm4a' : 'webm';
            const formData = new FormData();
            formData.append('audio', blob, `voice.${ext}`);
            
            try {
              const res = await fetch('/upload-chat-audio', {
                method: 'POST',
                body: formData
              });
              const data = await res.json();
              
              socket.emit('chat-message', {
                text: '',
                audioUrl: data.url
              });
            } catch (err) {
              console.error('Ошибка загрузки голосового:', err);
            }
          };
          
          mediaRecorder.start();
          isRecording = true;

        } catch (err) {

          alert('Не удалось получить доступ к микрофону. Разрешите доступ в настройках браузера.');
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();

        isRecording = false;
        btn.textContent = '🎤';
        btn.style.background = 'rgba(255,255,255,0.1)';

    // === Запись кружка через Canvas ===
    const videoModal = document.getElementById('video-record-modal');
    const videoPreview = document.getElementById('video-preview');
    const timerEl = document.getElementById('recording-timer');
    const recordBtnStart = document.getElementById('record-video-start');
    const switchCameraActive = document.getElementById('switch-camera-active');
    const sendVideoBtn = document.getElementById('send-video-btn');
    const retakeVideoBtn = document.getElementById('retake-video-btn');
    const cancelVideoBtn = document.getElementById('cancel-video');
    const canvasEl = document.getElementById('record-canvas');

    let stream = null;
    let videoRecorder = null;
    let videoChunks = [];
    let isVideoRecording = false;
    let videoMimeType = '';
    let currentFacingMode = 'user';
    let recordTimer = null;
    let recordSeconds = 0;
    let lastBlob = null;
    let canvasAnimId = null;

    if (window.MediaRecorder) {
      if (MediaRecorder.isTypeSupported('video/mp4')) videoMimeType = 'video/mp4';
      else if (MediaRecorder.isTypeSupported('video/webm')) videoMimeType = 'video/webm';
    }

    async function startPreview() {
      try {
        videoPreview.pause();
        
        if (stream) stream.getTracks().forEach(t => t.stop());
        
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: 480, height: 480 },
          audio: true
        });
        
        videoPreview.srcObject = stream;
        videoPreview.muted = true;
        videoPreview.play();
        
        if (!canvasAnimId) {
          drawToCanvas();
        }
      } catch (err) {
        console.error('Ошибка доступа к камере:', err);
        alert('Нет доступа к камере.');
        closeVideoModal();
      }
    }

    function drawToCanvas() {
      const ctx = canvasEl.getContext('2d');
      
      function draw() {
        if (videoPreview.videoWidth > 0) {
          if (currentFacingMode === 'user') {
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(videoPreview, -canvasEl.width, 0, canvasEl.width, canvasEl.height);
            ctx.restore();
          } else {
            ctx.drawImage(videoPreview, 0, 0, canvasEl.width, canvasEl.height);
          }
        }
        canvasAnimId = requestAnimationFrame(draw);
      }
      draw();
    }

    document.getElementById('record-video').addEventListener('click', () => {
      document.getElementById('chat-modal').style.display = 'none';
      videoModal.style.display = 'flex';
      
      videoChunks = [];
      lastBlob = null;
      sendVideoBtn.style.display = 'none';
      retakeVideoBtn.style.display = 'none';
      videoPreview.style.opacity = '1';
      
      switchCameraActive.style.display = 'flex';
      
      startPreview();
    });

   switchCameraActive.addEventListener('click', async () => {
  if (sendVideoBtn.style.display === 'block') return;

  currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';

  // Если запись идет, мы НЕ останавливаем старый поток полностью, 
  // а просто меняем камеру для Canvas.
  try {
    const newStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacingMode, width: 480, height: 480 }
    });

    // Меняем видео-дорожку в превью
    videoPreview.srcObject = newStream;
    videoPreview.play();

    // Если запись идет, добавляем новую видео-дорожку в поток Canvas
    if (isVideoRecording && videoRecorder && videoRecorder.stream) {
      const videoTrack = newStream.getVideoTracks()[0];
      // В MediaRecorder нельзя на лету поменять дорожку, 
      // но Canvas сам подхватит новый поток, так как мы рисуем с videoPreview.
    }

    // Останавливаем старую видео-дорожку (аудио оставляем!)
    if (stream) {
      stream.getVideoTracks().forEach(track => track.stop());
    }
    // Сохраняем новый поток для аудио (если оно было)
    const oldAudio = stream ? stream.getAudioTracks()[0] : null;
    stream = newStream;
    if (oldAudio) {
      stream.addTrack(oldAudio);
    }

  } catch (err) {
    console.error('Ошибка переключения камеры:', err);
  }
});

    recordBtnStart.addEventListener('click', () => {
      if (!isVideoRecording) {
        videoChunks = [];
        lastBlob = null;
        
        const canvasStream = canvasEl.captureStream(30);
        
        const audioTrack = stream.getAudioTracks()[0];
        if (audioTrack) {
          canvasStream.addTrack(audioTrack);
        }
        
        videoRecorder = new MediaRecorder(canvasStream, videoMimeType ? { mimeType: videoMimeType } : undefined);
        
        videoRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) videoChunks.push(e.data);
        };
        
        videoRecorder.onstop = () => {
          lastBlob = new Blob(videoChunks, { type: videoMimeType || 'video/webm' });
          const url = URL.createObjectURL(lastBlob);
          
          videoPreview.srcObject = null;
          videoPreview.src = url;
          videoPreview.muted = false;
          videoPreview.loop = true;
          videoPreview.play();
          
          sendVideoBtn.style.display = 'block';
          retakeVideoBtn.style.display = 'block';
        };
        
        videoRecorder.start();
        isVideoRecording = true;
        
        recordBtnStart.classList.add('recording-active');
        timerEl.style.display = 'block';
        recordSeconds = 0;
        timerEl.textContent = '00:00';
        
        recordTimer = setInterval(() => {
          recordSeconds++;
          const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
          const s = String(recordSeconds % 60).padStart(2, '0');
          timerEl.textContent = `${m}:${s}`;
          
          if (recordSeconds >= 30) {
            stopRecording();
          }
        }, 1000);
        
      } else {
        stopRecording();
      }
    });

    function stopRecording() {
      isVideoRecording = false;
      if (videoRecorder && videoRecorder.state !== 'inactive') {
        videoRecorder.stop();
      }
      clearInterval(recordTimer);
      timerEl.style.display = 'none';
      recordBtnStart.classList.remove('recording-active');
      
      switchCameraActive.style.display = 'none';
    }

    sendVideoBtn.addEventListener('click', async () => {
      if (!lastBlob) return;
      
      const ext = videoMimeType.includes('mp4') ? 'mp4' : 'webm';
      const formData = new FormData();
      formData.append('video', lastBlob, `circle.${ext}`);
      
      try {
        const res = await fetch('/upload-chat-video', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        socket.emit('chat-message', {
          text: '',
          videoUrl: data.url
        });
        
        closeVideoModal();
        document.getElementById('chat-modal').style.display = 'flex';

        console.error('Ошибка:', err);
        alert('Не удалось отправить кружок');
      }
    });

    retakeVideoBtn.addEventListener('click', () => {
      lastBlob = null;
      videoChunks = [];
      sendVideoBtn.style.display = 'none';
      retakeVideoBtn.style.display = 'none';
      
      videoPreview.pause();
      videoPreview.src = '';
      videoPreview.removeAttribute('src');
      videoPreview.load();
      
      videoPreview.muted = true;
      videoPreview.loop = false;
      
      switchCameraActive.style.display = 'flex';
      
      startPreview();
    });

    cancelVideoBtn.addEventListener('click', closeVideoModal);

    function closeVideoModal() {
      if (isVideoRecording) stopRecording();
      
      videoPreview.pause();
      videoPreview.src = '';
      videoPreview.removeAttribute('src');
      videoPreview.load();
      
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      videoModal.style.display = 'none';
      document.getElementById('chat-modal').style.display = 'flex';
      
      switchCameraActive.style.display = 'flex';
    }

    // === Полноэкранный просмотр видео (как в Telegram) ===
    window.openVideoFullscreen = function(url) {
      const overlay = document.createElement('div');
      overlay.id = 'fullscreen-video-overlay';
      
      const video = document.createElement('video');
      video.id = 'fullscreen-video';
      video.src = url;
      video.autoplay = true;
      video.loop = true;
      video.playsInline = true;
      video.style.opacity = '1';
      video.style.transition = 'opacity 0.2s';
      
      const closeBtn = document.createElement('button');
      closeBtn.id = 'close-fullscreen-video';
      closeBtn.innerHTML = '✕';
      
      overlay.appendChild(video);
      document.body.appendChild(overlay);
      document.body.appendChild(closeBtn);
      
      video.addEventListener('click', (e) => {
        e.stopPropagation();
        if (video.paused) {
          video.play();
          video.style.opacity = '1';
        } else {
          video.pause();
          video.style.opacity = '0.5';
        }
      });
      
      function closeVideo() {
        video.pause();
        video.removeAttribute('src');
        video.load();
        overlay.remove();
        closeBtn.remove();
      }
      
      closeBtn.addEventListener('click', closeVideo);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeVideo();
      });
    };

    (function initSnow() {
      const canvas = document.getElementById('snow-canvas');
      const ctx = canvas.getContext('2d');

      let width = window.innerWidth;
      let height = window.innerHeight;

      canvas.width = width;
      canvas.height = height;

      const flakes = [];
      const FLAKE_COUNT = 80;

      for (let i = 0; i < FLAKE_COUNT; i++) {
        flakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2.5 + 0.5,
          speed: Math.random() * 0.8 + 0.3,
          drift: Math.random() * 0.6 - 0.3,
          opacity: Math.random() * 0.6 + 0.4
        });
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        flakes.forEach((f) => {
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${f.opacity})`;
          ctx.fill();

          f.y += f.speed;
          f.x += f.drift;

          if (f.y > height) {
            f.y = -5;
            f.x = Math.random() * width;
          }
          if (f.x > width) f.x = 0;
          if (f.x < 0) f.x = width;
        });

        requestAnimationFrame(draw);
      }

      draw();

      window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      });
    })();
